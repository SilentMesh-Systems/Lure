<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>SilentMesh Lure</title>
  <defs>
    <radialGradient id="tile" cx="0.45" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#0A0D0A"/>
      <stop offset="1" stop-color="#050605"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DFF5C" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#7DFF5C" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7DFF5C" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC2A" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#5CFF3A" stop-opacity="0.7"/>
      <stop offset="0.68" stop-color="#E9FFD9"/>
      <stop offset="0.9" stop-color="#7DFF5C" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3DDC2A" stop-opacity="0"/>
    </linearGradient>
    <filter id="g1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="g2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="512" height="512" fill="#000"/>
  <rect x="78" y="66" width="356" height="356" rx="72" fill="url(#tile)" stroke="url(#rim)" stroke-width="2"/>
  <!-- crescent: thin tail at lower left, thickest near the top right, tapered tip curving down -->
  <path id="c" d="M112 322 Q 236 162 336 186 Q 366 194 384 220 Q 362 200 334 193 Q 244 174 112 322 Z" fill="url(#arc)"/>
  <use href="#c" filter="url(#g2)" opacity="0.9"/>
  <use href="#c" filter="url(#g1)"/>
  <use href="#c"/>
</svg>
