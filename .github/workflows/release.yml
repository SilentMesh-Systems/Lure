name: release
# Nothing reaches users until the founder approves it:
#   1. A GitHub release is published (draft first, notes written for users).
#   2. Tests run on Linux and Windows, and the tag must be v + the pyproject version exactly (v0.1.0b3, not v0.1.0-beta.3).
#   3. The publish job waits on the `pypi` environment, which requires a named reviewer's approval.
#   4. Users are then told an update exists; it installs only when they run `lure update` and type yes.
on:
  release:
    types: [published]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag matches version
        shell: bash
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v$v" || { echo "tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
          test "$(python -c 'import lure;print(lure.__version__)')" = "$v" || { echo "lure/__init__.py version differs"; exit 1; }
      - run: python -m unittest discover -s tests -v
        env:
          NO_PROXY: "*"
  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi   # set "Required reviewers" on this environment; publishing pauses until approved
    permissions:
      id-token: write   # PyPI trusted publishing, no stored token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
