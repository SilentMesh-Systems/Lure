[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "silentmesh-lure"
version = "0.1.0b2"
description = "Credential lures for everyone: planted credentials that give the attacker away. Alert on use, not on open."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "SilentMesh Systems Private Limited"}]

keywords = ["deception", "honeytoken", "canary", "security", "blue-team", "mcp", "incident-response"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License",
               "Topic :: Security", "Environment :: Console", "Intended Audience :: System Administrators"]

[project.urls]
Homepage = "https://www.silentmesh.me/lure/"
Source = "https://github.com/SilentMesh-Systems/Lure"
Issues = "https://github.com/SilentMesh-Systems/Lure/issues"

[project.scripts]
lure = "lure.__main__:main"
silentmesh-lure = "lure.__main__:main"

[tool.setuptools]
packages = ["lure"]
