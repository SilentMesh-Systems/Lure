name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]  # macOS on hold (founder, 6 Nov)
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -X faulthandler -m unittest discover -s tests -v
        timeout-minutes: 5
        env:
          NO_PROXY: "*"
          PYTHONFAULTHANDLER: "1"
